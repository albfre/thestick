<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Stick - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/logo.png" />
</head>

<body class="theme">
    <header class="site-header">
        <div class="wrap">
            <a href="index.html">
                <span class="sr-only">The Stick</span>
                <img src="img/logo.png" alt="">
            </a>
            <nav class="site-nav" aria-label="Global">
                <a href="index.html">The Stick</a>
                <a href="philosophy.html">Philosophy</a>
                <a href="shop.html">Collection</a>
                <a href="portfolio.html" aria-current="page">Portfolio</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        <section class="page-intro">
            <div>
                <span class="eyebrow">Portfolio</span>
                <h1 class="display">A new <em>era</em> in interior design</h1>
            </div>
            <p class="lede">Where less is more.</p>
        </section>

        <div class="portfolio-grid">
            <figure class="work">
                <div class="work-media">
                    <img src="img/vase-web.jpg"
                        alt="A pale stoneware vase on a white pedestal, with The Stick resting in it">
                </div>
                <figcaption>
                    <h2><span class="brand">The Stick</span></h2>
                </figcaption>
            </figure>

            <figure class="work">
                <div class="work-media">
                    <img src="img/cube-crop.jpg"
                        alt="The Cube: a solid wooden block on a slender pedestal. Text: When thinking outside the box is old"
                        loading="lazy">
                </div>
                <figcaption>
                    <h2><span class="brand">The Cube</span></h2>
                </figcaption>
            </figure>

            <figure class="work">
                <div class="work-media">
                    <img src="img/rock-crop.jpg"
                        alt="The Cube, Hard Rock Edition: a small granite cube resting on top of the wooden cube"
                        loading="lazy">
                </div>
                <figcaption>
                    <h2><span class="brand">The Cube</span></h2>
                    <span class="work-note">Hard Rock Edition</span>
                </figcaption>
            </figure>
        </div>
    </main>
</body>

</html>
