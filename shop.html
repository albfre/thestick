<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Stick - Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/logo.png" />
</head>

<body class="theme">
    <header class="site-header">
        <div class="wrap">
            <a href="index.html">
                <span class="sr-only">The Stick</span>
                <img src="img/logo.png" alt="">
            </a>
            <nav class="site-nav" aria-label="Global">
                <a href="index.html">The Stick</a>
                <a href="philosophy.html">Philosophy</a>
                <a href="shop.html" aria-current="page">Collection</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        <section class="page-intro">
            <div>
                <span class="eyebrow">Collection</span>
                <h1 class="display">Swedish <em>hardwoods</em></h1>
            </div>
            <p class="lede">Tired of non-stick kitchen utensils?</p>
        </section>

        <div class="shop-grid">
            <article class="product">
                <div class="product-media"><img src="img/IMG_1950.jpg" alt="The Stick in maple" loading="lazy"></div>
                <div class="product-meta">
                    <div>
                        <h2>Maple</h2>
                    </div>
                    <span class="price">&euro;120</span>
                </div>
                <button type="button" class="add-to-cart">Add to cart</button>
            </article>

            <article class="product">
                <div class="product-media"><img src="img/IMG_1958.jpg" alt="The Stick in oak" loading="lazy"></div>
                <div class="product-meta">
                    <div>
                        <h2>Oak</h2>
                    </div>
                    <span class="price">&euro;140</span>
                </div>
                <button type="button" class="add-to-cart" disabled>Sold out</button>
            </article>

            <article class="product">
                <div class="product-media"><img src="img/IMG_1952.jpg" alt="The Stick in ash" loading="lazy"></div>
                <div class="product-meta">
                    <div>
                        <h2>Ash</h2>
                    </div>
                    <span class="price">&euro;100</span>
                </div>
                <button type="button" class="add-to-cart">Add to cart</button>
            </article>

            <article class="product">
                <div class="product-media"><img src="img/IMG_1953.jpg" alt="The Stick in beech" loading="lazy"></div>
                <div class="product-meta">
                    <div>
                        <h2>Beech</h2>
                    </div>
                    <span class="price">&euro;90</span>
                </div>
                <button type="button" class="add-to-cart">Add to cart</button>
            </article>

            <article class="product">
                <div class="product-media"><img src="img/IMG_1960.jpg" alt="The Stick in birch" loading="lazy"></div>
                <div class="product-meta">
                    <div>
                        <h2>Birch</h2>
                    </div>
                    <span class="price">&euro;80</span>
                </div>
                <button type="button" class="add-to-cart">Add to cart</button>
            </article>

            <article class="product">
                <div class="product-media"><img src="img/IMG_1961.jpg" alt="The Stick in willow" loading="lazy"></div>
                <div class="product-meta">
                    <div>
                        <h2>Willow</h2>
                    </div>
                    <span class="price">&euro;60</span>
                </div>
                <button type="button" class="add-to-cart">Add to cart</button>
            </article>
        </div>
    </main>
</body>

</html>
