<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>The Stick - Shop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/logo.png" />
    <style>
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1280px;
            margin: 0 auto;
        }

        .product-card {
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            overflow: hidden;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
            background: #fff;
        }

        .product-card:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .product-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            object-position: center calc(80%);
            background: #f3f4f6;
        }

        .product-info {
            padding: 1.25rem;
        }

        .product-info h2 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #111;
        }

        .product-info .price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 1rem;
        }

        .add-to-cart {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .add-to-cart:hover {
            background: #333;
        }

        .add-to-cart svg {
            width: 18px;
            height: 18px;
        }

        .shop-header {
            text-align: center;
            padding: 3rem 1rem 1rem;
        }

        .shop-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #111;
        }

        .shop-header p {
            color: #6b7280;
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }
    </style>
</head>
